<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0807">
<meta name="color-scheme" content="dark">
<title>Vin & Veritas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0f0807;
  --bg-elev: #1a100c;
  --bg-card: #221610;
  --ink: #f8f1e6;
  --ink-dim: #d4c4b2;
  --ink-faint: #948070;
  --gold: #d4b073;
  --gold-bright: #f0cd8a;
  --green: #7fb368;
  --green-bright: #a5d68f;
  --red: #d06560;
  --red-bright: #e88884;
  --line: #3a251c;
  --line-soft: #251610;
}
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter Tight', -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(212, 176, 115, 0.10) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(208, 101, 96, 0.06) 0%, transparent 70%);
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  opacity: 0.05;
  pointer-events: none;
  z-index: 1;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
  padding-bottom: 80px;
  background: var(--bg);
  min-height: 100vh;
}

/* Header */
.hero {
  padding: 28px 20px 18px;
  text-align: center;
  border-bottom: 1px solid var(--line);
  position: relative;
  background: var(--bg);
}
.hero::after {
  content: '';
  position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%);
  width: 48px; height: 1px;
  background: var(--gold);
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
  font-weight: 600;
}
.title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 46px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.01em;
  font-style: italic;
  color: var(--ink);
}
.title .ampersand {
  font-weight: 400;
  color: var(--gold);
  margin: 0 4px;
}
.subtitle {
  color: var(--ink-faint);
  margin-top: 10px;
  font-style: italic;
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
}

/* Stats */
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1px;
  background: var(--line);
  border-bottom: 1px solid var(--line);
}
.stat {
  background: var(--bg);
  padding: 16px 8px;
  text-align: center;
}
.stat-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 600;
  line-height: 1;
}
.stat-num.green { color: var(--green-bright); }
.stat-num.red { color: var(--red-bright); }
.stat-num.gold { color: var(--gold-bright); }
.stat-label {
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-top: 5px;
  font-weight: 600;
}

/* Search modes */
.search-modes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--bg);
  border-bottom: 1px solid var(--line-soft);
}
.search-mode {
  padding: 12px 8px;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 600;
  background: transparent;
  border: none;
  color: var(--ink-faint);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  font-family: inherit;
  transition: all 0.2s;
}
.search-mode.active {
  color: var(--gold-bright);
  border-bottom-color: var(--gold);
}

/* Search */
.search-wrap {
  padding: 14px 20px 12px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
  border-bottom: 1px solid var(--line-soft);
  position: relative;
}
.search {
  width: 100%;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 13px 16px 13px 42px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  border-radius: 0;
}
.search:focus { border-color: var(--gold); }
.search::placeholder { color: var(--ink-faint); font-style: italic; }
.search-icon {
  position: absolute;
  left: 34px; top: 50%; transform: translateY(-50%);
  color: var(--gold);
  pointer-events: none;
}

/* Filter chips */
.filters {
  display: flex;
  gap: 8px;
  padding: 12px 20px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--line-soft);
  background: var(--bg);
}
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  padding: 7px 14px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  border-radius: 0;
}
.chip.active.green-filter { background: var(--green); border-color: var(--green); color: #0f0807; font-weight: 700; }
.chip.active.red-filter { background: var(--red); border-color: var(--red); color: #0f0807; font-weight: 700; }
.chip.active:not(.green-filter):not(.red-filter) { background: var(--gold); border-color: var(--gold); color: var(--bg); font-weight: 700; }

/* List */
.list { padding: 4px 0; background: var(--bg); }
.wine {
  display: grid;
  grid-template-columns: 4px 1fr auto;
  gap: 14px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
  background: var(--bg);
  transition: background 0.15s;
  align-items: stretch;
}
.wine:active { background: var(--bg-elev); }
.wine-bar {
  width: 4px;
  align-self: stretch;
  min-height: 60px;
}
.wine-bar.green { background: var(--green); box-shadow: 0 0 14px rgba(127, 179, 104, 0.5); }
.wine-bar.red { background: var(--red); box-shadow: 0 0 14px rgba(208, 101, 96, 0.5); }
.wine-bar.unpriced { background: var(--ink-faint); }
.wine-info { min-width: 0; }
.wine-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  font-weight: 500;
  line-height: 1.2;
  margin-bottom: 4px;
  color: var(--ink);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.wine-meta {
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 4px;
}
.wine-meta .vintage { color: var(--gold); font-weight: 600; }
.wine-meta .dot { color: var(--line); }
.wine-loc {
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.wine-loc-icon {
  display: inline-block;
  width: 9px; height: 9px;
  border: 1px solid var(--gold);
  position: relative;
  flex-shrink: 0;
}
.wine-loc-icon::after {
  content: '';
  position: absolute;
  width: 3px; height: 3px;
  background: var(--gold);
  top: 2px; left: 2px;
}
.wine-price { text-align: right; flex-shrink: 0; align-self: center; }
.price-amt {
  font-family: 'Cormorant Garamond', serif;
  font-size: 21px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}
.price-amt.green { color: var(--green-bright); }
.price-amt.red { color: var(--red-bright); }
.price-amt.unknown { color: var(--ink-faint); font-style: italic; font-size: 14px; }
.price-status {
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-top: 5px;
  font-weight: 700;
}
.price-status.green { color: var(--green-bright); }
.price-status.red { color: var(--red-bright); }
.price-status.unknown { color: var(--ink-faint); }

.wine.drunk { opacity: 0.4; }
.wine.drunk .wine-name { text-decoration: line-through; }

.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-faint);
}
.empty-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-style: italic;
  margin-bottom: 8px;
  color: var(--ink-dim);
}
.empty-hint { font-size: 13px; }

/* Pairing search hint */
.pairing-hint {
  background: var(--bg-card);
  padding: 10px 20px;
  font-size: 11px;
  color: var(--ink-faint);
  border-bottom: 1px solid var(--line-soft);
  display: none;
  font-style: italic;
}
.pairing-hint.show { display: block; }
.pairing-hint strong { color: var(--gold); font-style: normal; }

/* Modal */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-bg.show { display: flex; animation: fadeIn 0.2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal {
  background: var(--bg-elev);
  width: 100%;
  max-width: 480px;
  max-height: 92vh;
  overflow-y: auto;
  border-top: 1px solid var(--gold);
  animation: slideUp 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
  position: relative;
}
.modal-close {
  position: absolute;
  top: 12px; right: 12px;
  width: 36px; height: 36px;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}
.modal-content { padding: 32px 24px 28px; }
.modal-status {
  display: inline-block;
  padding: 6px 14px;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 18px;
}
.modal-status.green { background: rgba(127, 179, 104, 0.18); color: var(--green-bright); border: 1px solid var(--green); }
.modal-status.red { background: rgba(208, 101, 96, 0.18); color: var(--red-bright); border: 1px solid var(--red); }
.modal-status.unknown { background: rgba(148, 128, 112, 0.18); color: var(--ink-faint); border: 1px solid var(--ink-faint); }
.modal-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  font-weight: 500;
  line-height: 1.15;
  margin-bottom: 8px;
  color: var(--ink);
}
.modal-vintage {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  color: var(--gold);
  font-style: italic;
  margin-bottom: 22px;
}

/* Location card - prominent */
.loc-card {
  background: linear-gradient(135deg, rgba(212, 176, 115, 0.12), rgba(212, 176, 115, 0.04));
  border: 1px solid var(--gold);
  padding: 16px 18px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.loc-icon-big {
  width: 32px; height: 32px;
  border: 1.5px solid var(--gold);
  position: relative;
  flex-shrink: 0;
}
.loc-icon-big::after {
  content: '';
  position: absolute;
  width: 8px; height: 8px;
  background: var(--gold);
  top: 6px; left: 6px;
}
.loc-info { flex: 1; min-width: 0; }
.loc-label {
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 700;
  margin-bottom: 4px;
}
.loc-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  color: var(--ink);
  font-weight: 500;
  line-height: 1.3;
}

.modal-price {
  background: var(--bg-card);
  padding: 22px 16px;
  margin-bottom: 22px;
  text-align: center;
  border: 1px solid var(--line);
}
.modal-price-amt {
  font-family: 'Cormorant Garamond', serif;
  font-size: 40px;
  font-weight: 600;
  line-height: 1;
}
.modal-price-amt.green { color: var(--green-bright); }
.modal-price-amt.red { color: var(--red-bright); }
.modal-price-amt.unknown { color: var(--ink-faint); }
.modal-price-label {
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-top: 10px;
  font-weight: 600;
}
.modal-message {
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-style: italic;
  margin-bottom: 22px;
  padding: 0 8px;
  line-height: 1.4;
}
.modal-message.green { color: var(--green-bright); }
.modal-message.red { color: var(--red-bright); }
.modal-message.unknown { color: var(--ink-faint); }

/* Pairing block */
.pairing-block {
  background: var(--bg-card);
  border-left: 3px solid var(--gold);
  padding: 16px 18px;
  margin-bottom: 22px;
}
.pairing-label {
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 700;
  margin-bottom: 8px;
}
.pairing-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  color: var(--ink-dim);
  font-style: italic;
  line-height: 1.5;
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
.detail {
  background: var(--bg-elev);
  padding: 12px 14px;
}
.detail-label {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 4px;
  font-weight: 600;
}
.detail-val { font-size: 14px; color: var(--ink); }
.detail-val.serif {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
}
.actions {
  display: grid;
  gap: 10px;
  margin-top: 22px;
}
.btn {
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 14px;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 0;
}
.btn:active { background: var(--gold); color: var(--bg); }
.btn.muted { border-color: var(--line); color: var(--ink-faint); }

.notes-block {
  margin-bottom: 22px;
  padding: 14px 16px;
  background: var(--bg-card);
  border-left: 2px solid var(--ink-faint);
  font-style: italic;
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  color: var(--ink-dim);
}

.reset-link {
  text-align: center;
  padding: 24px 20px 32px;
  color: var(--ink-faint);
  font-size: 12px;
  background: var(--bg);
}
.reset-link a {
  color: var(--ink-faint);
  text-decoration: underline;
  cursor: pointer;
}

.loading { padding: 40px; text-align: center; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="eyebrow">Allott Family Cellar</div>
    <div class="title">Vin<span class="ampersand">&</span>Veritas</div>
    <div class="subtitle">a quiet guide to what's safe to pour</div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="search-modes">
    <button class="search-mode active" data-mode="wine">Search wines</button>
    <button class="search-mode" data-mode="food">Search by food</button>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" class="search" id="search" placeholder="name, grape, region, vintage…" autocomplete="off">
  </div>

  <div class="pairing-hint" id="pairingHint">
    Try: <strong>steak</strong>, <strong>oysters</strong>, <strong>chicken</strong>, <strong>pizza</strong>, <strong>cheese</strong>, <strong>BBQ</strong>, <strong>fish</strong>, <strong>pasta</strong>, <strong>lamb</strong>, <strong>spicy</strong>
  </div>

  <div class="filters" id="filters">
    <button class="chip green-filter active" data-filter="green">🟢 Safe to pour</button>
    <button class="chip red-filter" data-filter="red">🔴 Ask Will first</button>
    <button class="chip" data-filter="all">All bottles</button>
    <button class="chip" data-type="red">Red</button>
    <button class="chip" data-type="white">White</button>
    <button class="chip" data-type="sparkling">Sparkling</button>
    <button class="chip" data-type="rose">Rosé</button>
    <button class="chip" data-type="dessert">Dessert</button>
    <button class="chip" data-type="fortified">Fortified</button>
  </div>

  <div class="list" id="list"><div class="loading">Loading cellar…</div></div>

  <div class="reset-link">
    <a id="resetLink">Reset all "drunk" markings</a>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="modal-close" id="modalClose">×</button>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

019,"type":"white","grapes":"Chardonnay","producer":"Yeringberg","country":"Australia","region":"Victoria","size":"750ml","price":59.76,"priceSource":"market","drinkStart":2023,"drinkEnd":2029,"section":"Front top","row":"2","col":"12","notes":"","pairings":"roast chicken, creamy pasta, lobster, brie, mushroom risotto"},{"id":"787279","name":"Yeringberg Chardonnay","vintage":2019,"type":"white","grapes":"Chardonnay","producer":"Yeringberg","country":"Australia","region":"Victoria","size":"750ml","price":59.76,"priceSource":"market","drinkStart":2023,"drinkEnd":2029,"section":"Front top","row":"1","col":"12","notes":"","pairings":"roast chicken, creamy pasta, lobster, brie, mushroom risotto"}];
const THRESHOLD = 100;

let drunkSet = new Set();
let currentFilter = 'green';
let currentType = null;
let searchQuery = '';
let searchMode = 'wine';

async function loadDrunk() {
  try {
    const r = await window.storage.get('drunk_v1');
    if (r && r.value) drunkSet = new Set(JSON.parse(r.value));
  } catch (e) {}
}
async function saveDrunk() {
  try { await window.storage.set('drunk_v1', JSON.stringify([...drunkSet])); }
  catch (e) { console.error('save failed', e); }
}

function priceClass(w) {
  if (w.price === null) return 'unknown';
  return w.price < THRESHOLD ? 'green' : 'red';
}
function fmtPrice(p) {
  if (p === null) return 'No price';
  if (p >= 1000) return '$' + Math.round(p).toLocaleString();
  return '$' + p.toFixed(0);
}
function statusLabel(w) {
  if (w.price === null) return 'Unknown';
  return w.price < THRESHOLD ? 'Open it' : 'Ask Will';
}
function locString(w) {
  const parts = [];
  if (w.section) parts.push(w.section);
  const rc = [];
  if (w.row) rc.push('R' + w.row);
  if (w.col) rc.push('C' + w.col);
  if (rc.length) parts.push(rc.join('·'));
  return parts.join(' · ');
}
function locFull(w) {
  const parts = [];
  if (w.section) parts.push(w.section);
  if (w.row && w.col) parts.push('Row ' + w.row + ', Col ' + w.col);
  else if (w.row) parts.push('Row ' + w.row);
  else if (w.col) parts.push('Col ' + w.col);
  return parts.join(' — ') || 'Location not recorded';
}

function renderStats() {
  const total = WINES.filter(w => !drunkSet.has(w.id)).length;
  const green = WINES.filter(w => !drunkSet.has(w.id) && w.price !== null && w.price < THRESHOLD).length;
  const red = WINES.filter(w => !drunkSet.has(w.id) && w.price !== null && w.price >= THRESHOLD).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-num gold">${total}</div><div class="stat-label">Bottles</div></div>
    <div class="stat"><div class="stat-num green">${green}</div><div class="stat-label">Open Freely</div></div>
    <div class="stat"><div class="stat-num red">${red}</div><div class="stat-label">Check First</div></div>
  `;
}

function renderList() {
  const q = searchQuery.toLowerCase().trim();
  let filtered = WINES.filter(w => {
    if (drunkSet.has(w.id)) return false;
    if (currentFilter === 'green' && !(w.price !== null && w.price < THRESHOLD)) return false;
    if (currentFilter === 'red' && !(w.price !== null && w.price >= THRESHOLD)) return false;
    if (currentType && w.type !== currentType) return false;
    if (q) {
      let hay;
      if (searchMode === 'food') {
        hay = (w.pairings + ' ' + w.type).toLowerCase();
      } else {
        hay = (w.name + ' ' + w.grapes + ' ' + w.region + ' ' + w.country + ' ' + w.producer + ' ' + (w.vintage||'') + ' ' + w.section).toLowerCase();
      }
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  
  filtered.sort((a, b) => {
    if (currentFilter === 'green') return (a.price || 999999) - (b.price || 999999);
    return (b.price || 0) - (a.price || 0);
  });
  
  const list = document.getElementById('list');
  if (filtered.length === 0) {
    const hint = searchMode === 'food'
      ? 'Try "steak", "oysters", "chicken", or "pizza"'
      : 'Try a different filter or search term';
    list.innerHTML = `<div class="empty"><div class="empty-title">Nothing here</div><div class="empty-hint">${hint}</div></div>`;
    return;
  }
  
  list.innerHTML = filtered.map(w => {
    const cls = priceClass(w);
    const meta = [];
    if (w.vintage) meta.push(`<span class="vintage">${w.vintage}</span>`);
    if (w.grapes) meta.push(escapeHtml(w.grapes.length > 24 ? w.grapes.slice(0,22)+'…' : w.grapes));
    if (w.region) meta.push(escapeHtml(w.region));
    const loc = locString(w);
    return `
      <div class="wine ${drunkSet.has(w.id) ? 'drunk' : ''}" data-id="${w.id}">
        <div class="wine-bar ${cls}"></div>
        <div class="wine-info">
          <div class="wine-name">${escapeHtml(w.name)}</div>
          <div class="wine-meta">${meta.join('<span class="dot">•</span>')}</div>
          ${loc ? `<div class="wine-loc"><span class="wine-loc-icon"></span>${escapeHtml(loc)}</div>` : ''}
        </div>
        <div class="wine-price">
          <div class="price-amt ${cls}">${fmtPrice(w.price)}</div>
          <div class="price-status ${cls}">${statusLabel(w)}</div>
        </div>
      </div>
    `;
  }).join('');
  
  list.querySelectorAll('.wine').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.id));
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openModal(id) {
  const w = WINES.find(x => x.id === id);
  if (!w) return;
  
  const cls = priceClass(w);
  const isDrunk = drunkSet.has(w.id);
  
  let message = '';
  if (cls === 'green') message = '"Pour without hesitation."';
  else if (cls === 'red') message = '"This one carries weight — a quick word with Will."';
  else message = '"No price recorded — best to ask."';
  
  const details = [];
  if (w.type) details.push(['Type', w.type.charAt(0).toUpperCase()+w.type.slice(1), false]);
  if (w.grapes) details.push(['Grape', w.grapes, true]);
  if (w.region) details.push(['Region', w.region, false]);
  if (w.country) details.push(['Country', w.country, false]);
  if (w.producer) details.push(['Producer', w.producer, true]);
  if (w.size && w.size !== '750ml') details.push(['Size', w.size, false]);
  if (w.drinkStart || w.drinkEnd) {
    const win = (w.drinkStart || '?') + ' – ' + (w.drinkEnd || '?');
    details.push(['Drink Window', win, false]);
  }
  if (w.priceSource) {
    details.push(['Price Source', w.priceSource === 'market' ? 'Market est.' : 'Purchase price', false]);
  }
  
  const locStr = locFull(w);
  const hasLoc = w.section || w.row || w.col;
  
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-status ${cls}">${statusLabel(w)}</div>
    <div class="modal-name">${escapeHtml(w.name)}</div>
    ${w.vintage ? `<div class="modal-vintage">${w.vintage}</div>` : ''}
    
    ${hasLoc ? `
      <div class="loc-card">
        <div class="loc-icon-big"></div>
        <div class="loc-info">
          <div class="loc-label">Location in cellar</div>
          <div class="loc-value">${escapeHtml(locStr)}</div>
        </div>
      </div>
    ` : ''}
    
    <div class="modal-price">
      <div class="modal-price-amt ${cls}">${fmtPrice(w.price)}</div>
      <div class="modal-price-label">${w.priceSource === 'market' ? 'Market Value (AUD)' : w.priceSource === 'purchase' ? 'Purchase Price (AUD)' : 'Price Not Recorded'}</div>
    </div>
    
    <div class="modal-message ${cls}">${message}</div>
    
    ${w.pairings ? `
      <div class="pairing-block">
        <div class="pairing-label">Pairs With</div>
        <div class="pairing-text">${escapeHtml(w.pairings)}</div>
      </div>
    ` : ''}
    
    <div class="detail-grid">
      ${details.map(([l, v, serif]) => `
        <div class="detail">
          <div class="detail-label">${l}</div>
          <div class="detail-val ${serif ? 'serif' : ''}">${escapeHtml(v)}</div>
        </div>
      `).join('')}
    </div>
    
    ${w.notes ? `<div class="notes-block">${escapeHtml(w.notes)}</div>` : ''}
    
    <div class="actions">
      ${isDrunk
        ? `<button class="btn muted" data-act="undrunk">Mark as still in cellar</button>`
        : `<button class="btn" data-act="drunk">Mark as drunk</button>`
      }
    </div>
  `;
  
  document.getElementById('modalContent').querySelectorAll('[data-act]').forEach(b => {
    b.addEventListener('click', async () => {
      if (b.dataset.act === 'drunk') drunkSet.add(w.id);
      else drunkSet.delete(w.id);
      await saveDrunk();
      renderStats();
      renderList();
      closeModal();
    });
  });
  
  document.getElementById('modalBg').classList.add('show');
}
function closeModal() {
  document.getElementById('modalBg').classList.remove('show');
}

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderList();
});

document.querySelectorAll('.search-mode').forEach(b => {
  b.addEventListener('click', () => {
    searchMode = b.dataset.mode;
    document.querySelectorAll('.search-mode').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const search = document.getElementById('search');
    if (searchMode === 'food') {
      search.placeholder = 'steak, oysters, chicken, pizza…';
      document.getElementById('pairingHint').classList.add('show');
    } else {
      search.placeholder = 'name, grape, region, vintage…';
      document.getElementById('pairingHint').classList.remove('show');
    }
    renderList();
  });
});

document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    if (c.dataset.filter) {
      currentFilter = c.dataset.filter;
      document.querySelectorAll('.chip[data-filter]').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
    } else if (c.dataset.type) {
      if (currentType === c.dataset.type) {
        currentType = null;
        c.classList.remove('active');
      } else {
        currentType = c.dataset.type;
        document.querySelectorAll('.chip[data-type]').forEach(x => x.classList.remove('active'));
        c.classList.add('active');
      }
    }
    renderList();
  });
});

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalBg').addEventListener('click', e => {
  if (e.target.id === 'modalBg') closeModal();
});
document.getElementById('resetLink').addEventListener('click', async () => {
  if (confirm('Clear all "drunk" markings? This cannot be undone.')) {
    drunkSet = new Set();
    await saveDrunk();
    renderStats();
    renderList();
  }
});

(async () => {
  await loadDrunk();
  renderStats();
  renderList();
})();
</script>
</body>
</html>
